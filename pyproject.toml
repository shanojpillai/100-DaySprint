[project]
name = "100-daysprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shanoj Pillai", email = "shanoj.pillai@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.3",
    "fastapi>=0.162.0",
    "google-adk>=2.14.0",
    "guardrails-ai>=0.11.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "litellm>=1.108.1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "termcolor>=3.3.0",
    "tiktoken>=0.14.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
100-daysprint = "100_daysprint:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
